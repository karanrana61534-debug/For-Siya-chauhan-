<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5f9e,#ffc1d6);
overflow:hidden;
}

.card{
background:white;
padding:35px;
border-radius:25px;
text-align:center;
width:90%;
max-width:500px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
position:relative;
}

h1{
color:#ff0066;
margin-bottom:20px;
font-size:34px;
}

p{
font-size:20px;
line-height:1.8;
color:#444;
margin-bottom:20px;
}

button{
padding:14px 30px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
margin:10px;
transition:.3s;
}

#yes{
background:#ff0066;
color:white;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:#555;
color:white;
position:absolute;
}

.heart{
position:fixed;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100vh);
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="card">

<h1>❤️ Hey Siya ❤️</h1>

<p>
I've been wanting to tell you something for a long time... 🥺❤️
</p>

<p>
You make my world brighter, my heart happier, and my days more beautiful.
</p>

<p>
I don't know what the future holds, but I know one thing...
</p>

<h2 style="color:#ff0066;">
I Love You ❤️
</h2>

<p>
Will you be mine? 🌹
</p>

<button id="yes" onclick="location.href='yes.html'">
❤️ YES
</button>

<button id="no">
🙈 NO
</button>

</div>

<script>
const no=document.getElementById("no");

function move(){
const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";
}

no.addEventListener("mouseover",move);
no.addEventListener("click",move);

setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},300);
</script>

</body>
</html>
