<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Siya ❤️</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4e8b,#ffb6c1);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.box{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
width:90%;
max-width:420px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
animation:fade 1.2s;
}

h1{
color:#ff0066;
font-size:34px;
}

p{
font-size:19px;
color:#444;
line-height:1.6;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:#ff0066;
color:white;
cursor:pointer;
transition:.3s;
margin-top:20px;
}

button:hover{
transform:scale(1.08);
background:#ff3385;
}

@keyframes fade{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}
</style>

</head>
<body>

<div class="box">

<h1>Hey Siya Chauhan ❤️</h1>

<p>
Every heartbeat reminds me of you.
</p>

<p>
I made this little website only for you.
Please read it till the end...
It means a lot to me.
</p>

<a href="proposal.html">
<button>Open My Heart ❤️</button>
</a>

</div>

</body>
</html>
<link rel="stylesheet" href="style.css">
