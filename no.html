<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ffc1d6,#ffe6ee);
overflow:hidden;
text-align:center;
}

.card{
background:white;
padding:40px;
border-radius:25px;
max-width:500px;
width:90%;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
color:#ff0066;
margin-bottom:20px;
}

p{
font-size:20px;
line-height:1.8;
color:#444;
}

button{
margin-top:25px;
padding:12px 30px;
border:none;
border-radius:40px;
background:#ff0066;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff3385;
}
</style>
</head>

<body>

<div class="card">

<h1>❤️ Thank You For Reading ❤️</h1>

<p>
I completely respect your decision. ❤️<br><br>

No matter what your answer is, I'm grateful that you took the time to read my message.

I genuinely wish you happiness and all the best for the future. 🌹
</p>

<button onclick="location.href='index.html'">
🏠 Back to Home
</button>

</div>

</body>
</html>
